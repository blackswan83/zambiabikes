<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zambia Bikes badge logo">
  <defs>
    <linearGradient id="zbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.45" stop-color="#F7B733"/>
      <stop offset="1" stop-color="#E8791D"/>
    </linearGradient>
    <radialGradient id="zbSunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF7D6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF7D6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="zbDisc"><circle cx="256" cy="256" r="196"/></clipPath>
    <path id="zbArcTop" d="M 44 256 A 212 212 0 0 1 468 256" fill="none"/>
    <path id="zbArcBottom" d="M 12 256 A 244 244 0 0 0 500 256" fill="none"/>
  </defs>

  <!-- outer badge ring -->
  <circle cx="256" cy="256" r="252" fill="#0C2E1C"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#F7B733" stroke-width="6"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#E8791D" stroke-width="8"/>
  <circle cx="256" cy="256" r="196" fill="url(#zbSky)"/>

  <!-- inner scene -->
  <g clip-path="url(#zbDisc)">
    <!-- sun -->
    <circle cx="256" cy="215" r="120" fill="url(#zbSunGlow)"/>
    <circle cx="256" cy="215" r="56" fill="#FFF3C4"/>
    <!-- far hills -->
    <path d="M 60 340 Q 140 290 220 330 T 460 322 L 460 460 L 60 460 Z" fill="#1F7A48"/>
    <!-- baobab silhouette -->
    <g transform="translate(150 342) scale(1.9)" fill="#0C2E1C">
      <path d="M -9 0 C -8 -14 -8 -24 -10 -32 C -18 -35 -25 -41 -28 -49 C -21 -44 -14 -41 -9 -40
               C -11 -46 -15 -51 -20 -56 C -13 -53 -8 -48 -5 -43 C -5 -51 -6 -58 -9 -65
               C -3 -58 0 -50 1 -43 C 5 -49 11 -53 19 -55 C 13 -49 8 -44 5 -39
               C 12 -41 19 -40 25 -37 C 17 -35 10 -33 5 -30 C 3 -21 3 -11 4 0 Z"/>
    </g>
    <!-- near ground -->
    <path d="M 60 372 Q 150 344 260 362 T 460 356 L 460 460 L 60 460 Z" fill="#0C2E1C"/>
    <!-- birds -->
    <g stroke="#0C2E1C" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 330 130 q 9 -9 18 0 q 9 -9 18 0"/>
      <path d="M 372 152 q 7 -7 14 0 q 7 -7 14 0"/>
    </g>
    <!-- rider silhouette mid-jump -->
    <g transform="translate(268 268) rotate(-14)" stroke="#0C2E1C" fill="none" stroke-linecap="round">
      <!-- wheels -->
      <circle cx="-46" cy="26" r="26" stroke-width="9"/>
      <circle cx="46" cy="26" r="26" stroke-width="9"/>
      <circle cx="-46" cy="26" r="5" fill="#0C2E1C" stroke="none"/>
      <circle cx="46" cy="26" r="5" fill="#0C2E1C" stroke="none"/>
      <!-- frame -->
      <path d="M -46 26 L -8 26 L 10 2 L 46 26 M -8 26 L -16 -2 L 10 2 M -16 -2 L -24 -8 M 10 2 L 14 -12" stroke-width="8" stroke-linejoin="round"/>
      <!-- handlebar -->
      <path d="M 14 -12 L 26 -16" stroke-width="8"/>
      <!-- rider body -->
      <path d="M -6 24 L -2 6 L -14 -20 L 4 -34 L 26 -16" stroke-width="9" stroke-linejoin="round"/>
      <!-- head + helmet -->
      <circle cx="14" cy="-44" r="12" fill="#0C2E1C" stroke="none"/>
      <path d="M 0 -46 a 14 14 0 0 1 27 -5" stroke="#E8791D" stroke-width="7"/>
    </g>
  </g>

  <!-- inner rim highlight -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#0C2E1C" stroke-width="4" opacity="0.35"/>

  <!-- ring text (drawn last, on the dark outer ring) -->
  <g fill="#FFE9BC" font-family="'Fredoka','Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700">
    <text font-size="40" letter-spacing="6">
      <textPath href="#zbArcTop" startOffset="50%" text-anchor="middle">ZAMBIA BIKES</textPath>
    </text>
    <text font-size="24" letter-spacing="4" fill="#F7B733">
      <textPath href="#zbArcBottom" startOffset="50%" text-anchor="middle">RIDE WILD • RIDE KIND</textPath>
    </text>
  </g>
  <!-- ring stars -->
  <g fill="#F7B733">
    <circle cx="34" cy="256" r="7"/>
    <circle cx="478" cy="256" r="7"/>
  </g>
</svg>
