[/Script/Engine.InputSettings]
; Deliberately empty of action and axis mappings.
;
; Zambia Rush reads keys in AZRPlayerController::InputKey, which the engine
; calls once per OS key event. That is not a stylistic preference: turbo is
; tap-RATE driven (one press opens a 10 s window, then throttle tracks
; taps/sec x 0.10 / 0.8), so presses have to be counted, and every
; frame-sampled input system — legacy axis mappings and Enhanced Input alike —
; collapses two presses in one frame into one. The browser game queues taps for
; the same reason (js/game3d.js:174,244,5295) and we queue them the same way.
;
; It also means the whole project needs no input .uasset of any kind.
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=NoCapture
DefaultViewportMouseLockMode=DoNotLock
