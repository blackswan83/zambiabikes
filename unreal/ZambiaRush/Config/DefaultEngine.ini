[/Script/EngineSettings.GameMapsSettings]
; No .umap of our own. /Engine/Maps/Entry is an empty level that ships with the
; engine, and AZRGameMode::StartPlay spawns the entire world into it — terrain,
; rider, props, sky, lights, post process. That keeps Content/ down to a single
; generated material and the repository entirely text.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/ZambiaRush.ZRGameMode

[/Script/Engine.LocalPlayer]
; Unreal's FieldOfView is HORIZONTAL. The browser game solves a vertical FOV
; because that is what Three.js takes (js/game3d.js:3159). Do not port that
; conversion — set the horizontal angle directly and pin the axis here, or a
; wide window fish-eyes exactly the way the original was written to avoid.
AspectRatioAxisConstraint=AspectRatio_MaintainXFOV

[/Script/Engine.RendererSettings]
; Lumen on: the browser game fakes bounce light with a flat ambient term, and
; letting Lumen do it properly is most of "same game, better engine".
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False

; Nanite is deliberately NOT used. It needs SM6 (macOS 15+) and an M2 or newer,
; and would buy nothing: the terrain is ~83k triangles and the props are simple
; geometry. Leaving it off keeps the game on M1 and macOS 13.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AntiAliasing=2

[/Script/MacTargetPlatform.MacTargetSettings]
TargetedRHIs=SF_METAL_SM5
