[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
UsePakFile=True

; THIS BLOCK IS WHY THE PACKAGED APP IS NOT A BLACK SCREEN.
;
; The game loads engine content by path at runtime — /Engine/BasicShapes for
; prop and bike geometry, /Engine/EngineFonts for the HUD, /Engine/Maps/Entry
; as the level. Those are string references, which the cooker cannot see. In
; the editor they resolve fine; in a packaged build LoadObject returns null and
; you get an empty world with no error worth the name.
;
; Anything referenced by path — not by a UPROPERTY the cooker can follow — must
; be listed here.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineFonts")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky")
+DirectoriesToAlwaysCook=(Path="/Engine/Maps")
+DirectoriesToAlwaysCook=(Path="/Game")
